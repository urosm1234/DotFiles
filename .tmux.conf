set -g mouse on                      # click panes, scroll, drag to resize
set -g mode-keys vi                  # vim keys in copy mode
set -g base-index 1                  # number windows from 1
setw -g pane-base-index 1
set -g history-limit 100000          # more scrollback
set -s escape-time 0                 # no Esc delay (important for Neovim)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"   # true colour in kitty

# vim-style copy: v to select, y to copy to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
